[project]
name = "qepi"
version = "0.1.0"
description = "Quantum-enhanced policy iteration on the example of a mountain car"
#readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Egor E. Nuzhin", email = "e.e.nuzhin@gmail.com" },
    { name = "Dmitry Yudin" },
]

#license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "gymnasium>=0.29",
    "qubovert>=1.2",
    "dimod>=0.12",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Figures 6 and 7 only; also needs a Leap token (dwave config create).
hardware = ["dwave-system>=1.20"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
no-binary-package = ["qubovert"]

[tool.uv.build-backend]
# Flat layout: the package sits at ./qepi, not ./src/qepi.
module-root = ""